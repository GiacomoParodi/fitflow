# Pacchetti dell'app desktop. Locale: `npm run dist`. Rilascio: .github/workflows/release.yml (vedi docs/RILASCIO.md).
appId: it.fitflow.app
productName: GymPlan
copyright: Copyright © Giacomo Parodi

directories:
  output: release
  buildResources: build

# Solo l'interfaccia compilata, il server, il processo Electron e i contenuti.
# Le dipendenze di produzione (package.json → dependencies) vengono aggiunte da electron-builder.
files:
  - package.json
  - dist/**/*
  - dist-server/**/*
  - dist-electron/**/*
  - content/**/*

asar: true

publish:
  provider: github
  owner: GiacomoParodi
  repo: fitflow

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Nessun certificato Apple a pagamento: firma ad-hoc ("-").
  # Su Apple Silicon un'app senza alcuna firma risulta "danneggiata"; con la firma ad-hoc parte
  # dopo l'"Apri comunque" (vedi docs/INSTALLAZIONE.md). Hardened runtime e notarizzazione
  # richiedono un Developer ID, quindi sono disattivati.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

dmg:
  title: ${productName} ${version}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

# Installer semplice: un clic, per l'utente corrente (niente permessi di amministratore).
# Disinstallando, i dati in %APPDATA%\GymPlan restano.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: GymPlan
  deleteAppDataOnUninstall: false

# Linux (Ubuntu/Debian): .deb consigliato (installa anche la sandbox di Chromium con i permessi giusti,
# necessari su Ubuntu 24.04) e AppImage portatile.
linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Office
  icon: build/icon.png
  syncDesktopName: true
  maintainer: Giacomo Parodi <GiacomoParodi@users.noreply.github.com>
  synopsis: Gestione di corsi di ginnastica con assistente AI locale
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: GymPlan
      Comment: Gestione corsi di ginnastica

deb:
  artifactName: ${productName}-${version}-amd64.${ext}
