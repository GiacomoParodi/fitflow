# Pubblica una nuova versione dell'app desktop quando si fa push di un tag vX.Y.Z (vedi docs/RILASCIO.md).
# 1. prepara: controlla che il tag corrisponda a "version" in package.json e crea la release in bozza;
# 2. pacchetti: costruisce in parallelo Mac (Apple Silicon + Intel) e Windows e carica i file nella bozza;
# 3. pubblica: rende pubblica la release solo se tutti i pacchetti sono andati a buon fine.
name: Rilascio

on:
  push:
    tags: ['v*.*.*']
  # Pulsante "Run workflow" nella scheda Actions: rilascia la versione scritta in package.json
  # dal commit scelto (il tag vX.Y.Z viene creato alla pubblicazione).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rilascio-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Determina il tag della versione
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alla versione $version di package.json"
              exit 1
            fi
          elif gh release view "v$version" --json isDraft -q '.isDraft' 2>/dev/null | grep -q false; then
            echo "::error::La versione $version è già pubblicata: aumenta \"version\" in package.json"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Crea la release in bozza
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then target="--verify-tag"; else target="--target $GITHUB_SHA"; fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft $target \
              --title "FitFlow ${TAG#v}" \
              --notes "Come installare o aggiornare: https://github.com/${{ github.repository }}/blob/main/docs/INSTALLAZIONE.md

          - **Windows**: FitFlow-Setup-${TAG#v}.exe
          - **Mac con chip Apple (M1, M2, M3…)**: FitFlow-${TAG#v}-arm64.dmg
          - **Mac con processore Intel**: FitFlow-${TAG#v}-x64.dmg" \
              --generate-notes
          fi

  pacchetti:
    needs: prepara
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:electron
      - name: Crea i pacchetti e caricali nella release
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          # Nessun certificato a pagamento: su Mac firma ad-hoc (identity "-" in electron-builder.yml).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  pubblica:
    needs: [prepara, pacchetti]
    runs-on: ubuntu-latest
    steps:
      - name: Pubblica la release
        run: gh release edit "${{ needs.prepara.outputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
